[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "legal-literature-agent"
version = "0.1.0"
description = "Framework for legally constrained open-access literature discovery and PDF handling."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0", "mcp[cli]>=1.27.0", "langgraph>=0.2"]

[project.optional-dependencies]
test = ["pytest>=7.0"]
dev = ["pytest>=7.0"]

[project.scripts]
lit-agent = "lit_agent.cli:main"
lit-agent-chat = "lit_agent.chat:main"
lit-agent-rank = "lit_agent.journal_rank:main"
lit-agent-mcp = "lit_agent.mcp_server:main"

[tool.setuptools.packages.find]
include = ["lit_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
